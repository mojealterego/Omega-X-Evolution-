[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omega-x-evolution"
dynamic = ["version"]
description = "OMEGA-X Evolution: evolutionary intelligence and scientific discovery"
authors = [
    {name = "Sakana AI", email = "robert@sakana.ai"}
]
maintainers = [{name = "OMEGA-X Evolution"}]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
urls = {Homepage = "https://github.com/mojealterego/Omega-X-Evolution-", Documentation = "https://github.com/mojealterego/Omega-X-Evolution-/tree/main/docs", Repository = "https://github.com/mojealterego/Omega-X-Evolution-", Issues = "https://github.com/mojealterego/Omega-X-Evolution-/issues", Upstream = "https://github.com/SakanaAI/ShinkaEvolve"}
dependencies = [
    "openai",
    "numpy",
    "pandas",
    "anthropic>=1.9.0",
    "requests",
    "boto3",
    "pydantic",
    "backoff",
    "python-dotenv",
    "instructor",
    "python-Levenshtein",
    "radon",
    "unidiff",
    "dill",
    "hydra-core==1.3.2",
    "matplotlib",
    "networkx",
    "seaborn",
    "moviepy",
    "scikit-learn",
    "adjustText",
    "markdown",
    "aiofiles",
    "google-genai>=2.13,<3",
    "psutil",
    "httpx>=0.27"
]

[project.optional-dependencies]
wandb = ["wandb>=0.19"]
accelerators = ["torch"]

[project.scripts]
omega-x-evolution = "omega_x_evolution.__main__:main"
omega-x-distributed = "omega_x_evolution.distributed:main"
omega-x-meta = "omega_x_evolution.meta:main"
omega-x-superopt = "omega_x_evolution.superopt:main"
omega-x-formal = "omega_x_evolution.formal:main"
omega-x-knowledge = "omega_x_evolution.knowledge:main"
omega-x-multilevel = "omega_x_evolution.multilevel:main"
omega-x-recursive = "omega_x_evolution.recursive:main"
omega-x-benchmarks = "omega_x_evolution.benchmarks:main"
omega-x-discovery = "omega_x_evolution.discovery:main"
omega-x-polyglot = "omega_x_evolution.polyglot:main"
omega-x-hybrid = "omega_x_evolution.neuro_symbolic:main"
omega-x-nas = "omega_x_evolution.neural:main"
omega-x-compute = "omega_x_evolution.compute:main"
omega-x-memory = "omega_x_evolution.graph_memory:main"
omega-x-experiments = "omega_x_evolution.experiments:main"
shinka_omega = "shinka.omega.__main__:main"
shinka_launch = "shinka.cli.launch:main"
shinka_models = "shinka.cli.models:main"
shinka_run = "shinka.cli.run:main"
shinka_visualize = "shinka.webui.visualization:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "omega_x_evolution.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["omega_x_evolution*", "shinka*"]

[tool.setuptools.package-data]
shinka = [
    "configs/*.yaml",
    "configs/*/*.yaml",
    "favicon.png",
    "tools/pricing/*.json",
    "embed/providers/*.csv",
    "llm/providers/*.csv",
    "webui/*.html",
    "webui/*.png",
    "webui/*.jpg",
]

[dependency-groups]
dev = [
    "pytest>=6.0",
    "pytest-cov",
    "ruff==0.15.6",
    "mypy",
    "black",
    "isort",
    "flake8",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.6",
    "mkdocstrings[python]>=0.30",
    "pymdown-extensions>=10.15",
]

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
    "integration: live external/provider integration coverage",
    "models_dev_live: live models.dev catalog contract coverage",
    "requires_secrets: tests that need CI secrets or private credentials",
]
