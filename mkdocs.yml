site_name: OMEGA-X Evolution
site_description: Autonomous evolutionary intelligence and scientific discovery
repo_url: https://github.com/mojealterego/Omega-X-Evolution-
repo_name: mojealterego/Omega-X-Evolution-
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site

theme:
  name: material
  logo: media/omega-x.svg
  favicon: media/omega-x.svg
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - scheme: default
      primary: custom
      accent: custom

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mojealterego/Omega-X-Evolution-
    - icon: fontawesome/solid/newspaper
      link: https://sakana.ai/shinka-evolve/

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - .
          options:
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            line_length: 88
            docstring_section_style: table

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - assets/stylesheets/extra.css
  - assets/stylesheets/async_throughput_demo.css
  - assets/stylesheets/bandit_selection.css

extra_javascript:
  - assets/javascripts/async_throughput_demo_core.js
  - assets/javascripts/async_throughput_demo.js
  - assets/javascripts/bandit_selection_core.js
  - assets/javascripts/bandit_selection.js

nav:
  - Home: index.md
  - OMEGA-X:
      - Identity Migration: omega/IDENTITY_MIGRATION.md
      - v4.1–v6: omega/EVOLUTION_V41_V6.md
      - v7–v9: omega/EVOLUTION_V7_V9.md
      - v10–v12: omega/EVOLUTION_V10_V12.md
      - v13–v15: omega/EVOLUTION_V13_V15.md
      - v16–v18: omega/EVOLUTION_V16_V18.md
      - v19–v20: omega/EVOLUTION_V19_V20.md
      - v24–v26: omega/EVOLUTION_V24_V26.md
      - v23: omega/EVOLUTION_V23.md
      - Extended Maintainer Roadmap: omega/MAINTAINER_ROADMAP.md
      - v22: omega/EVOLUTION_V22.md
      - v21: omega/EVOLUTION_V21.md
      - Acceptance Gates: omega/CLOSURE_REGISTER.md
      - Coevolution: OMEGA_COEVOLUTION.md
      - Runtime Hardening: OMEGA_HARDENING.md
      - Research Traceability: omega/RESEARCH_TRACEABILITY_v4.md
  - Upstream Foundation: upstream_index.md
  - Getting Started: getting_started.md
  - Core Concepts:
      - UCB1 Bandit LLM Selection: bandit_selection.md
      - Async Evolution: async_evolution.md
  - Usage:
      - Agentic Usage: agentic_usage.md
      - CLI Usage: cli_usage.md
      - Configuration: configuration.md
      - Local Models: support_local_models.md
  - WebUI: webui.md
  - API Reference:
      - Overview: reference/index.md
      - Core Runtime: reference/core_api.md
      - Database: reference/database_api.md
      - Launch: reference/launch_api.md
      - LLM: reference/llm_api.md
      - Embeddings: reference/embed_api.md
  - Examples: examples.md
